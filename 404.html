<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script type="text/javascript">
    // GitHub Pages: redireciona rotas do SPA para index.html
    // Detecta o base path (ex: /playground-app-prd ou /recibo) do primeiro segmento da URL
    sessionStorage.redirect = location.href;
    var segs = location.pathname.split('/').filter(Boolean);
    var base = '/' + (segs[0] || 'playground-app-prd') + '/';
    location.replace(location.origin + base);
  </script>
</head>
<body>Redirecionando...</body>
</html>
